spring.config.import=optional:file:.env[.properties]
spring.application.name=gymapp

## ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=${PGSSLMODE:require}&channelBinding=${PGCHANNELBINDING:require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

## ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

## ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

## ── Frontend ─────────────────────────────────────────────────────────────────
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

## ── Email / SMTP ─────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Do not test SMTP connection at startup — allows the app to start without live SMTP creds
spring.mail.test-connection=false
# From address must match the authenticated SMTP username (required by Gmail and most providers)
app.mail.from=${MAIL_USERNAME}

## ── Razorpay ─────────────────────────────────────────────────────────────────
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

## ── Cloudinary ───────────────────────────────────────────────────────────────
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
